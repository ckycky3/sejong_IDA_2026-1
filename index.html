<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>강의 퀴즈</title><!-- ★ 퀴즈 제목 수정 -->
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f5f4f0;
    --surface: #ffffff;
    --border: #e0ddd6;
    --text: #1a1a1a;
    --muted: #888;
    --accent: #2d5be3;
    --radius: 12px;
  }

  body {
    font-family: 'Noto Sans KR', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 40px 16px 80px;
  }

  .container { max-width: 600px; margin: 0 auto; }

  .header { margin-bottom: 28px; }
  .header h1 { font-size: 22px; font-weight: 700; margin-bottom: 6px; }
  .header p { font-size: 14px; color: var(--muted); line-height: 1.6; }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px;
    margin-bottom: 14px;
  }

  /* 학생 정보 */
  .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  .field label {
    display: block;
    font-size: 13px;
    font-weight: 500;
    color: var(--muted);
    margin-bottom: 6px;
  }

  .field input {
    width: 100%;
    padding: 10px 14px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-family: inherit;
    font-size: 14px;
    background: var(--bg);
    color: var(--text);
    outline: none;
    transition: border-color 0.15s;
  }
  .field input:focus { border-color: var(--accent); }

  /* 문항 */
  .question-num {
    font-size: 12px;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: 0.05em;
    margin-bottom: 6px;
  }
  .question-text {
    font-size: 15px;
    font-weight: 500;
    line-height: 1.6;
    margin-bottom: 14px;
  }

  /* 답안 입력 — password 타입으로 * 처리 */
  .answer-wrap { position: relative; }

  .answer-input {
    width: 100%;
    padding: 10px 44px 10px 14px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-family: inherit;
    font-size: 16px;
    letter-spacing: 4px;
    background: var(--bg);
    color: var(--text);
    outline: none;
    transition: border-color 0.15s;
  }
  .answer-input:focus { border-color: var(--accent); }

  /* 본인만 확인하는 토글 버튼 */
  .toggle-btn {
    position: absolute;
    right: 10px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    cursor: pointer;
    padding: 4px;
    color: var(--muted);
    font-size: 18px;
    line-height: 1;
  }
  .toggle-btn:hover { color: var(--text); }

  .hint {
    font-size: 12px;
    color: var(--muted);
    margin-top: 8px;
  }

  /* 제출 버튼 */
  .submit-btn {
    width: 100%;
    padding: 14px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: var(--radius);
    font-family: inherit;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: opacity 0.15s;
    margin-top: 4px;
  }
  .submit-btn:hover { opacity: 0.88; }
  .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .error-msg {
    display: none;
    color: #c0392b;
    font-size: 13px;
    margin-top: 10px;
    text-align: center;
  }

  /* 완료 화면 */
  .done {
    display: none;
    text-align: center;
    padding: 60px 24px;
  }
  .done-icon { font-size: 52px; margin-bottom: 16px; }
  .done h2 { font-size: 20px; font-weight: 700; margin-bottom: 8px; }
  .done p { font-size: 14px; color: var(--muted); }
</style>
</head>
<body>
<div class="container">

  <div class="header">
    <h1>강의 퀴즈</h1><!-- ★ 제목 수정 -->
    <p>답을 입력하면 *로 표시되어 옆 사람에게 보이지 않습니다.<br>본인만 확인하려면 👁 버튼을 누르세요.</p>
  </div>

  <form id="quizForm">

    <!-- 학생 정보 -->
    <div class="card">
      <div class="info-grid">
        <div class="field">
          <label>이름</label>
          <input type="text" id="name" placeholder="홍길동" autocomplete="off" required>
        </div>
        <div class="field">
          <label>학번</label>
          <input type="text" id="studentId" placeholder="20240001" autocomplete="off" required>
        </div>
      </div>
    </div>

    <!-- 문항 -->
    <div class="card">
      <div class="question-num">Q1</div>
      <div class="question-text">
        여기에 문항 내용을 입력하세요.<!-- ★ 문항 수정 -->
      </div>
      <div class="answer-wrap">
        <input
          type="password"
          class="answer-input"
          id="q1"
          placeholder="답을 입력하세요"
          autocomplete="new-password"
          required
        >
        <button type="button" class="toggle-btn" id="toggleBtn" title="내 답 보기">👁</button>
      </div>
      <p class="hint">* 입력 내용은 *로 표시됩니다</p>
    </div>

    <button type="submit" class="submit-btn" id="submitBtn">제출하기</button>
    <p class="error-msg" id="errorMsg">제출 중 오류가 발생했습니다. 다시 시도해주세요.</p>
  </form>

  <div class="done" id="doneScreen">
    <div class="done-icon">✅</div>
    <h2>제출 완료!</h2>
    <p>답안이 성공적으로 제출되었습니다.</p>
  </div>

</div>
<script>
// ★ Google Apps Script 배포 URL로 교체하세요
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx0OJHMHnUULBXOmLALrSxKOi81CXCrZTT9AMxh15EwtdL1h29qcn7ipb0BeaEd0Eae/exec";

// 👁 토글: * 숨김 ↔ 텍스트 표시
document.getElementById("toggleBtn").addEventListener("click", function () {
  const input = document.getElementById("q1");
  const isHidden = input.type === "password";
  input.type = isHidden ? "text" : "password";
  input.style.letterSpacing = isHidden ? "0" : "4px";
  this.textContent = isHidden ? "🙈" : "👁";
});

// 제출
document.getElementById("quizForm").addEventListener("submit", async function (e) {
  e.preventDefault();

  const btn = document.getElementById("submitBtn");
  const errMsg = document.getElementById("errorMsg");
  btn.disabled = true;
  btn.textContent = "제출 중...";
  errMsg.style.display = "none";

  const data = {
    timestamp: new Date().toLocaleString("ko-KR"),
    name: document.getElementById("name").value.trim(),
    studentId: document.getElementById("studentId").value.trim(),
    q1: document.getElementById("q1").value.trim(),
  };

  try {
    await fetch(SCRIPT_URL, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(data),
    });

    document.getElementById("quizForm").style.display = "none";
    document.querySelector(".header").style.display = "none";
    document.getElementById("doneScreen").style.display = "block";

  } catch (err) {
    errMsg.style.display = "block";
    btn.disabled = false;
    btn.textContent = "제출하기";
  }
});
</script>
</body>
</html>
