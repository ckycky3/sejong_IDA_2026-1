<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>강의 퀴즈</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f5f4f0;
    --surface: #ffffff;
    --border: #e0ddd6;
    --text: #1a1a1a;
    --muted: #888;
    --accent: #2d5be3;
    --radius: 12px;
  }

  body {
    font-family: 'Noto Sans KR', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 40px 16px 80px;
  }

  .container { max-width: 600px; margin: 0 auto; }

  /* 상태 화면 공통 */
  .screen {
    text-align: center;
    padding: 80px 24px;
    display: none;
  }
  .screen.active { display: block; }
  .screen-icon { font-size: 48px; margin-bottom: 16px; }
  .screen h2 { font-size: 20px; font-weight: 700; margin-bottom: 8px; }
  .screen p { font-size: 14px; color: var(--muted); line-height: 1.7; }

  .spinner {
    width: 36px; height: 36px;
    border: 3px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 20px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* 퀴즈 폼 */
  #quizScreen { display: none; }

  .header { margin-bottom: 28px; }
  .header h1 { font-size: 22px; font-weight: 700; margin-bottom: 6px; }
  .header p { font-size: 14px; color: var(--muted); line-height: 1.6; }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px;
    margin-bottom: 14px;
  }

  .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  .field label {
    display: block;
    font-size: 13px;
    font-weight: 500;
    color: var(--muted);
    margin-bottom: 6px;
  }
  .field input {
    width: 100%;
    padding: 10px 14px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-family: inherit;
    font-size: 14px;
    background: var(--bg);
    color: var(--text);
    outline: none;
    transition: border-color 0.15s;
  }
  .field input:focus { border-color: var(--accent); }

  .question-num {
    font-size: 12px;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: 0.05em;
    margin-bottom: 6px;
  }
  .question-text {
    font-size: 15px;
    font-weight: 500;
    line-height: 1.6;
    margin-bottom: 14px;
  }

  .answer-wrap { position: relative; }
  .answer-input {
    width: 100%;
    padding: 10px 44px 10px 14px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-family: inherit;
    font-size: 16px;
    letter-spacing: 4px;
    background: var(--bg);
    color: var(--text);
    outline: none;
    transition: border-color 0.15s;
  }
  .answer-input:focus { border-color: var(--accent); }

  .toggle-btn {
    position: absolute;
    right: 10px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    cursor: pointer;
    padding: 4px;
    color: var(--muted);
    font-size: 18px;
    line-height: 1;
  }
  .toggle-btn:hover { color: var(--text); }

  .hint { font-size: 12px; color: var(--muted); margin-top: 8px; }

  .submit-btn {
    width: 100%;
    padding: 14px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: var(--radius);
    font-family: inherit;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: opacity 0.15s;
    margin-top: 4px;
  }
  .submit-btn:hover { opacity: 0.88; }
  .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .error-msg {
    display: none;
    color: #c0392b;
    font-size: 13px;
    margin-top: 10px;
    text-align: center;
  }
</style>
</head>
<body>
<div class="container">

  <!-- 로딩 -->
  <div class="screen active" id="loadingScreen">
    <div class="spinner"></div>
    <p style="color: var(--muted); font-size: 14px;">퀴즈를 불러오는 중...</p>
  </div>

  <!-- 시작 전 잠금 -->
  <div class="screen" id="lockedScreen">
    <div class="screen-icon">🔒</div>
    <h2>퀴즈가 아직 시작되지 않았습니다</h2>
    <p>교수님이 퀴즈를 열면 자동으로 시작됩니다.<br>이 페이지를 열어두고 기다려 주세요.</p>
    <p style="margin-top: 16px; font-size: 13px; color: #bbb;" id="retryMsg"></p>
  </div>

  <!-- 제출 완료 -->
  <div class="screen" id="doneScreen">
    <div class="screen-icon">✅</div>
    <h2>제출 완료!</h2>
    <p>답안이 성공적으로 제출되었습니다.</p>
  </div>

  <!-- 오류 -->
  <div class="screen" id="errorScreen">
    <div class="screen-icon">⚠️</div>
    <h2>오류가 발생했습니다</h2>
    <p id="errorDetail">잠시 후 새로고침해주세요.</p>
  </div>

  <!-- 퀴즈 폼 -->
  <div id="quizScreen">
    <div class="header">
      <h1 id="quizTitle">강의 퀴즈</h1>
      <p>답을 입력하면 *로 표시되어 옆 사람에게 보이지 않습니다.<br>본인만 확인하려면 👁 버튼을 누르세요.</p>
    </div>

    <form id="quizForm">
      <div class="card">
        <div class="info-grid">
          <div class="field">
            <label>이름</label>
            <input type="text" id="name" placeholder="홍길동" autocomplete="off" required>
          </div>
          <div class="field">
            <label>학번</label>
            <input type="text" id="studentId" placeholder="20240001" autocomplete="off" required>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="question-num">Q1</div>
        <div class="question-text" id="questionText"></div>
        <div class="answer-wrap">
          <input type="password" class="answer-input" id="q1"
            placeholder="답을 입력하세요" autocomplete="new-password" required>
          <button type="button" class="toggle-btn" id="toggleBtn">👁</button>
        </div>
        <p class="hint">* 입력 내용은 *로 표시됩니다</p>
      </div>

      <button type="submit" class="submit-btn" id="submitBtn">제출하기</button>
      <p class="error-msg" id="submitError">제출 중 오류가 발생했습니다. 다시 시도해주세요.</p>
    </form>
  </div>

</div>
<script>
// =============================================
// ★ 여기만 수정하세요
// =============================================

// Apps Script 배포 URL
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx0OJHMHnUULBXOmLALrSxKOi81CXCrZTT9AMxh15EwtdL1h29qcn7ipb0BeaEd0Eae/exec";

// 잠금 상태일 때 재확인 주기 (초)
const POLL_INTERVAL = 10;

// =============================================
// 아래는 수정하지 않아도 됩니다
// =============================================

function showScreen(id) {
  ["loadingScreen", "lockedScreen", "doneScreen", "errorScreen"].forEach(s => {
    document.getElementById(s).classList.remove("active");
  });
  document.getElementById("quizScreen").style.display = "none";

  if (id === "quizScreen") {
    document.getElementById("quizScreen").style.display = "block";
  } else {
    document.getElementById(id).classList.add("active");
  }
}

let pollTimer = null;

async function loadQuiz() {
  try {
    const res = await fetch(`${SCRIPT_URL}?action=getQuiz&t=${Date.now()}`);
    const data = await res.json();

    if (data.status === "locked") {
      showScreen("lockedScreen");
      clearTimeout(pollTimer);
      let count = POLL_INTERVAL;
      const retryMsg = document.getElementById("retryMsg");
      retryMsg.textContent = `${count}초 후 자동으로 확인합니다...`;
      const tick = setInterval(() => {
        count--;
        retryMsg.textContent = `${count}초 후 자동으로 확인합니다...`;
        if (count <= 0) clearInterval(tick);
      }, 1000);
      pollTimer = setTimeout(loadQuiz, POLL_INTERVAL * 1000);

    } else if (data.status === "open") {
      clearTimeout(pollTimer);
      if (data.title) document.getElementById("quizTitle").textContent = data.title;
      document.getElementById("questionText").textContent = data.question;
      showScreen("quizScreen");

    } else {
      showScreen("errorScreen");
      document.getElementById("errorDetail").textContent = "알 수 없는 응답입니다.";
    }

  } catch (err) {
    showScreen("errorScreen");
    document.getElementById("errorDetail").textContent =
      "서버에 연결할 수 없습니다. 잠시 후 새로고침해주세요.";
  }
}

// 👁 토글
document.getElementById("toggleBtn").addEventListener("click", function () {
  const input = document.getElementById("q1");
  const isHidden = input.type === "password";
  input.type = isHidden ? "text" : "password";
  input.style.letterSpacing = isHidden ? "0" : "4px";
  this.textContent = isHidden ? "🙈" : "👁";
});

// 제출
document.getElementById("quizForm").addEventListener("submit", async function (e) {
  e.preventDefault();
  const btn = document.getElementById("submitBtn");
  const errMsg = document.getElementById("submitError");
  btn.disabled = true;
  btn.textContent = "제출 중...";
  errMsg.style.display = "none";

  const data = {
    action: "submit",
    timestamp: new Date().toLocaleString("ko-KR"),
    name: document.getElementById("name").value.trim(),
    studentId: document.getElementById("studentId").value.trim(),
    q1: document.getElementById("q1").value.trim(),
  };

  try {
    await fetch(SCRIPT_URL, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(data),
    });
    showScreen("doneScreen");
  } catch (err) {
    errMsg.style.display = "block";
    btn.disabled = false;
    btn.textContent = "제출하기";
  }
});

// 시작
loadQuiz();
</script>
</body>
</html>
